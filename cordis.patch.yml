# 给 Engramory 记忆库加一层本地自动召回 + 写入治理。
#
# 目标：把 Memmy / DSH-SEP 那类「每轮自动想起相关记忆」的好处留下，
# 同时保住 Engramory 的底线 —— 纯本地、不每轮塞正文、绝不自动写入。
#
# 它只读记忆库：用 BM25 检索当前这句话，命中才注入「文件名 + 一行片段」，
# 没命中一个 token 都不注入。关掉它只需把 enabled 改成 false。
#
# storePath 支持 `~`；留空则本插件不工作（安全默认）。
- insert:
    - id: engramory-recall
      name: dsh-engramory-recall
      config:
        enabled: true
        storePath: ~/memory/engramory
        maxPointers: 4
        maxChars: 480
        # 消费侧门控（0.16.0 起）：检索回答「像不像」，门控回答「值不值得占上下文」。
        #   off     不干预（旧行为，留着对照）
        #   shadow  只算不改，但把「本来会降权/拦掉谁」记进账本 —— 想知道会拦掉什么，先开这个
        #   assist  把「总也用不上」「过期」的笔记降权（默认；只改排序，不删任何东西）
        #   enforce 把证据确凿的移出这一轮注入（它的证据门槛更高：携带次数与观察天数两条都要够）
        gate: assist
        # `project-` 类笔记多久没更新算过期（天）。过期只降权、不拦：旧不等于没用。
        gateStaleDays: 180
        nudge: true
