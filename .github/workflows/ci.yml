name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试（Node ${{ matrix.node }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 是 engines 声明的下限；22 是当前 LTS
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 本插件零第三方依赖，不需要 npm ci —— 没有 lockfile，也不该有
      - name: 跑测试
        run: npm test

      # 合成基准是确定性的（固定种子），所以能当回归测试用：
      # 分数低不红，数字漂走才红 —— 漂了就必须有人解释是回归还是刻意改动。
      - name: 基准自检（数字漂了必须有人解释）
        run: npm run bench:check

      # 地基句尺子：注入的那一行里到底有没有决定性那句话。
      # 地板写在 bench/foundation-expectations.json（默认档 / profile 档 / 留出组都要过），
      # 破地板就是召回质量真的掉了，不是机器差异 —— 容差 0.02 已经吃掉抖动。
      - name: 地基句尺子对账（召回质量不许悄悄退化）
        run: npm run bench:foundation -- --check

      - name: 确认包能打包（files 字段漏文件会让别人装上直接崩）
        run: npm pack --dry-run
