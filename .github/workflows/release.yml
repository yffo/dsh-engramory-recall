name: Release

# 打 tag 就发版。**不用任何长期 token** —— 走 npm 的 Trusted Publisher（GitHub OIDC）：
# npm 那边绑定「仓库 + 工作流文件名 release.yml」，这里用 id-token 换一次性凭证。
# 为什么必须这么干：bypass 2FA 的 token 已被 npm 限制（直接发布 2027-01 起失效），
# 而普通 token 每次发布都要 6 位 OTP —— 人肉发版迟早会因为「口令过期」卡住（2026-10-15 就卡过一次）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：换短时发布凭证 + 生成 provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **故意不写 registry-url**：写了它，setup-node 会往 $RUNNER_TEMP/.npmrc 里塞一行
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 并把 NODE_AUTH_TOKEN 导出成占位值 "XXXXX-XXXXX-XXXXX-XXXXX"。npm 只要在配置里
      # 看到 token 就**不再走 OIDC**，于是发布退化成「拿一个假 token 去 PUT」→
      # 404 Not Found - PUT https://registry.npmjs.org/<pkg>（0.9.0 首次发版就栽在这儿，
      # 日志里那句 bypass-2FA 提示就是它在用 token 的证据）。不发 registry-url，
      # npm 的默认 registry 就是 registry.npmjs.org，而发布凭证交给 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Node 22 自带的 npm 是 10.x，而**Trusted Publisher 需要 npm ≥ 11.5.1**
      # （Node 需要 ≥ 22.14.0）。不升这一下，OIDC 那条路根本不存在，会在 publish 那步
      # 报 ENEEDAUTH —— 看起来像「没配好 Trusted Publisher」，其实只是 npm 太老。
      - name: 确保 npm 支持 Trusted Publisher（≥ 11.5.1）
        run: |
          npm install -g 'npm@^11.5.1'
          node -v
          npm -v

      # tag 与 package.json 必须一致：否则 tag v0.9.0 会发出一个 0.8.2，事后没法解释。
      # 手动触发（workflow_dispatch）时没有 tag，就以 package.json 为准 —— 这条路径是给
      # 「tag 早就打过了、当时发不出去」准备的（0.9.0 就是这种情况：tag 在，npm 卡在口令上）。
      - name: 校验 tag 与 package.json 版本一致
        run: |
          pkg="$(node -p "require('./package.json').version")"
          case "${GITHUB_REF}" in
            refs/tags/*)
              tag="${GITHUB_REF_NAME#v}"
              if [ "$tag" != "$pkg" ]; then
                echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的 ${pkg} 不一致"
                exit 1
              fi
              ;;
            *) echo "手动触发：以 package.json 的 ${pkg} 为准" ;;
          esac
          echo "版本：$pkg"

      - name: 已经发过同一版本就跳过（重推 tag 不该炸）
        id: exists
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-engramory-recall@${version}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "registry 上已经有 ${version} 了，跳过发布（改版本号再打 tag）。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 确认发布凭证会走 OIDC（只打有无，不打值）
        run: |
          echo "OIDC 可用：$([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "node $(node -v) / npm $(npm -v)"
          raw="$(npm config get //registry.npmjs.org/:_authToken 2>/dev/null || true)"
          if [ -z "$raw" ] || [ "$raw" = "undefined" ] || [ "$raw" = "null" ]; then
            echo "_authToken：空 → 发布交给 OIDC（正确）"
          else
            echo "::error::配置里存在 _authToken，它会盖住 OIDC；请检查 setup-node 的 registry-url"
            exit 1
          fi

      # 把「npm 上还没绑定」和「发布本身出问题」分开：这里做一次与 npm publish 内部
      # 完全相同的 OIDC 交换（lib/utils/oidc.js 的
      # POST /-/npm/v1/oidc/token/exchange/package/<name>）。绑定没生效时它立刻给出
      # registry 的原话（HTTP 401/404 + message），比等 npm 把错误吞掉、外层只报一句
      # 笼统的 ENEEDAUTH 强得多；绑定生效时它只是提前拿一次临时 token。
      # 放在测试之前：缺绑定时 30 秒就失败，不必先烧两分钟测试。
      - name: 预检 OIDC 交换（Trusted Publisher 是否生效）
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::拿不到 ACTIONS_ID_TOKEN_REQUEST_URL —— workflow 需要 permissions: id-token: write"
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          token_url="$(AUD='npm:registry.npmjs.org' node -e 'const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL); u.searchParams.append("audience", process.env.AUD); process.stdout.write(u.href)')"
          id_token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$token_url" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value){console.error("拿不到 id-token：",JSON.stringify(j).slice(0,200));process.exit(1)}process.stdout.write(j.value)})')"
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' -X POST -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name}")"
          echo "交换接口 HTTP ${status}"
          # 判据是「回包里有没有 token」，不是 HTTP 码：成功是 **201 Created**（不是 200），
          # 第一次写成 `!= 200` 就把一次成功判成了失败 —— 记在这里。
          node -e 'const fs=require("fs");const raw=fs.readFileSync(process.argv[1],"utf8").trim();let j;try{j=JSON.parse(raw)}catch{console.log("registry 的原始回复：",raw.slice(0,300)||"(空)");process.exit(0)}console.log("registry 说：",j.token?"拿到临时 token（绑定有效）":(j.message||JSON.stringify(j).slice(0,300)))' "$body"
          got="$(node -e 'const fs=require("fs");const raw=fs.readFileSync(process.argv[1],"utf8").trim();let j=null;try{j=JSON.parse(raw)}catch{}process.stdout.write(j&&typeof j.token==="string"&&j.token?"yes":"no")' "$body")"
          if [ "$got" != "yes" ]; then
            echo "::error::OIDC 交换没成（HTTP ${status}）—— 先去 npm 包 Settings → Trusted Publisher 绑定：user=yffo / repo=dsh-engramory-recall / workflow=release.yml / environment 留空"
            exit 1
          fi

      # 发版前的门槛与 CI 完全相同：测试 + 基准数字不许漂 + 包能打出来
      - run: npm test
      - run: npm run bench:check
      - run: npm pack --dry-run

      # 注意这里**没有** NODE_AUTH_TOKEN / NPM_TOKEN：
      # 配好 Trusted Publisher 之后 npm 自己用 OIDC 换凭证。若哪天有人塞回长期 token，
      # 这条流水线就退回到「口令会过期、会被限制」的老路 —— 那正是它要解决的问题。
      - name: 发布（Trusted Publisher / OIDC + provenance）
        if: steps.exists.outputs.skip != 'true'
        # --loglevel verbose 是必须的：npm 的 OIDC 交换（lib/utils/oidc.js）**吞掉所有错误**，
        # 任何失败都只写一行 verbose 日志然后返回 undefined，外层于是报一个笼统的
        # "ENEEDAUTH need auth ... You need to authorize this machine using npm adduser" ——
        # 看起来像「没登录」，真因（registry 说没有绑定/字段不符）只在那行 verbose 里。
        run: npm publish --access public --provenance --loglevel verbose

      # 退出码不算数：直查版本端点，并把 registry 上的 shasum 与本地 pack 的逐字比对
      - name: 验证「发上去的就是这一份」
        if: steps.exists.outputs.skip != 'true'
        # npm 在 PUT 之后会异步处理一段（实测 0.16.0 这次等了约 8 分钟才公开可见，
        # 期间 202/404 都属正常）。窗口给到 15 分钟：宁可多等，也不要把「发上去了」
        # 判成「没发上去」——那会诱使人重推 tag，而重推只会撞 403（版本已占）。
        run: node scripts/verify-release.mjs --timeout 900
